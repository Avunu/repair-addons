# odoo-nix:managed — generated by odoo-nix (`odoo-init --sync`); edit only inside the odoo-nix:local region.
# Conventional commits: `fix:` → patch, `feat:` → minor, `!` or BREAKING CHANGE → major
# (an addon's version under releases).
style = "conventional"
allowed_types = [
  "build",
  "chore",
  "ci",
  "docs",
  "feat",
  "fix",
  "perf",
  "refactor",
  "revert",
  "style",
  "test",
]
# A scope is optional; when there is one it names an addon (or commits.extra-scopes).
allowed_scopes = [
  "ci",
  "deps",
  "docs",
  "main",
  "release",
  "repair_customer_reference",
  "repair_fleet_vehicle",
  "repair_order_template_service",
  "repair_purchase_order_parts",
  "repair_service_so_sync",
  "repair_stage",
  "repair_timesheet_time_control",
  "tests",
]
subject_length = 100
line_length = 0
subject_capitalized = false
subject_not_punctuated = true
imperative_subject = false
no_wip = true
no_fixup = true
merge_commit = false
